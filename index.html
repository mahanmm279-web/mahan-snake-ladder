

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مار و پله | بازی آنلاین</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Tahoma,Arial,sans-serif;text-align:center;
 padding:15px;
}
header{padding:12px}
h1{color:#ffd34e;font-size:29px}
.subtitle{color:#aab7ca}
.panel{
 max-width:520px;margin:15px auto;
 background:#1d2a40;padding:16px;border-radius:18px;
}
button,select{
 border:0;border-radius:12px;padding:13px;
 font-size:16px;font-weight:bold;cursor:pointer;
}
select{background:#263954;color:white;width:100%;margin:8px 0}
button{background:#ffca42;color:#172033;margin:5px}
button:disabled{opacity:.5}
#board{
 width:min(94vw,470px);aspect-ratio:1;
 margin:15px auto;display:grid;
 grid-template-columns:repeat(10,1fr);
 grid-template-rows:repeat(10,1fr);
 border:4px solid #ffd34e;border-radius:12px;
 overflow:hidden;background:#e8e6ce;
}
.cell{
 position:relative;border:1px solid #a7aa92;
 display:flex;align-items:center;justify-content:center;
 color:#182335;font-size:clamp(9px,2.7vw,14px);
 font-weight:bold;
}
.cell:nth-child(odd){background:#c8e9c4}
.cell:nth-child(even){background:#fff0bc}
.number{position:absolute;top:2px;right:3px;font-size:9px;color:#65705c}
.special{font-size:clamp(13px,4vw,22px)}
.tokens{position:absolute;bottom:2px;left:2px;right:2px;
 display:flex;justify-content:center;gap:1px;flex-wrap:wrap}
.token{font-size:clamp(12px,3.5vw,19px);line-height:1}
.info{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap}
.player{padding:10px;border-radius:12px;background:#263954;flex:1;min-width:110px}
.active{outline:2px solid #ffd34e}
#dice{font-size:65px;margin:8px}
#message{min-height:30px;color:#ffe28a;font-weight:bold}
.small{font-size:12px;color:#aab7ca;line-height:2}
</style>
</head>
<body>
<header>
<h1>🐍 مار و پله 🪜</h1>
<div class="subtitle">بازی کن، تاس بریز و به خانه ۱۰۰ برس!</div>
</header>

<div class="panel">
<label>حالت بازی:</label>
<select id="mode">
<option value="computer">یک نفره با کامپیوتر</option>
<option value="local">دو نفره روی یک گوشی</option>
<option value="online">آنلاین با دوستان (به‌زودی)</option>
</select>
<button onclick="startGame()">شروع بازی جدید 🎮</button>
</div>

<div class="panel">
<div class="info">
<div class="player active" id="p0">🔴 بازیکن اول<br>خانه: 0</div>
<div class="player" id="p1">🔵 بازیکن دوم<br>خانه: 0</div>
</div>
<div id="board"></div>
<div id="dice">🎲</div>
<button id="roll" onclick="rollDice()">تاس بریز!</button>
<div id="message">برای شروع، بازی جدید را بزن.</div>
<div class="small">برای برد باید دقیقاً به خانه ۱۰۰ برسی.</div>
</div>

<script>
const snakes={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78};
const ladders={2:38,7:14,8:31,15:26,21:42,28:84,36:44,51:67,71:91,78:98,80:100};
const faces=["⚀","⚁","⚂","⚃","⚄","⚅"];
let positions=[0,0],turn=0,finished=false,players=2,computer=false;
let busy=false;

function buildBoard(){
 const board=document.getElementById("board");
 board.innerHTML="";
 for(let row=9;row>=0;row--){
  for(let col=0;col<10;col++){
   let num=row%2===0?row*10+col+1:row*10+(10-col);
   let cell=document.createElement("div");
   cell.className="cell";
   cell.id="c"+num;
   let icon="";
   if(snakes[num])icon="🐍";
   if(ladders[num])icon="🪜";
   cell.innerHTML='<span class="number">'+num+'</span><span class="special">'+icon+'</span><div class="tokens" id="t'+num+'"></div>';
   board.appendChild(cell);
  }
 }
}

function render(){
 for(let i=1;i<=100;i++)document.getElementById("t"+i).innerHTML="";
 positions.forEach((pos,i)=>{
  if(pos>0){
   let token=document.createElement("span");
   token.className="token";
   token.textContent=i===0?"🔴":"🔵";
   document.getElementById("t"+pos).appendChild(token);
  }
 });
 for(let i=0;i<2;i++){
  document.getElementById("p"+i).innerHTML=
  (i===0?"🔴 بازیکن اول":"🔵 "+(computer?"کامپیوتر":"بازیکن دوم"))+
  "<br>خانه: "+positions[i];
  document.getElementById("p"+i).classList.toggle("active",turn===i&&!finished);
 }
}

function startGame(){
 const mode=document.getElementById("mode").value;
 if(mode==="online"){
  document.getElementById("message").textContent=
  "بازی آنلاین در مرحله بعد اضافه می‌شود. فعلاً یکی از دو حالت دیگر را انتخاب کن.";
  return;
 }
 computer=mode==="computer";
 players=2;
 positions=[0,0];turn=0;finished=false;busy=false;
 document.getElementById("roll").disabled=false;
 document.getElementById("dice").textContent="🎲";
 document.getElementById("message").textContent="بازیکن اول شروع می‌کند! تاس بریز.";
 render();
}

function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

async function rollDice(){
 if(finished||busy)return;
 busy=true;
 document.getElementById("roll").disabled=true;
 let dice=1+Math.floor(Math.random()*6);
 for(let i=0;i<8;i++){
  document.getElementById("dice").textContent=faces[Math.floor(Math.random()*6)];
  await wait(70);
 }
 document.getElementById("dice").textContent=faces[dice-1];
 await wait(250);
 let old=positions[turn];
 let next=old+dice;
 if(next<=100)positions[turn]=next;
 render();

 if(next>100){
  document.getElementById("message").textContent="باید عدد دقیق بیاری! نوبت بعدی.";
 }else if(snakes[next]){
  await wait(450);
  positions[turn]=snakes[next];
  render();
  document.getElementById("message").textContent="🐍 وای! مار تو رو به خانه "+snakes[next]+" برگردوند!";
 }else if(ladders[next]){
  await wait(450);
  positions[turn]=ladders[next];
  render();
  document.getElementById("message").textContent="🪜 آفرین! نردبان تو رو به خانه "+ladders[next]+" برد!";
 }else{
  document.getElementById("message").textContent="عدد "+dice+" اومد! حرکت خوبی بود.";
 }

 if(positions[turn]===100){
  finished=true;
  document.getElementById("message").textContent=
  "🏆 تبریک! "+(turn===0?"بازیکن اول":"بازیکن دوم")+" برنده شد!";
  busy=false;
  render();
  return;
 }

 turn=1-turn;
 render();
 await wait(350);
 busy=false;
 document.getElementById("roll").disabled=false;

 if(computer&&turn===1){
  document.getElementById("message").textContent="🤖 کامپیوتر در حال تاس ریختن است...";
  await wait(800);
  rollDice();
 }
}

buildBoard();
render();
</script>
</body>
</html>
