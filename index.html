
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAHAN GAME</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 background:#101010;color:white;
 font-family:Tahoma,Arial;
 display:flex;justify-content:center;
 align-items:center;text-align:center;
 padding:20px
}
.container{width:100%;max-width:650px}
h1{color:#ffd700;font-size:38px}
h2{font-size:20px;color:#ddd;margin-bottom:35px}
.games{
 display:grid;grid-template-columns:1fr 1fr;
 gap:15px
}
a{
 text-decoration:none;color:white;
 background:#222;border:2px solid #d6a900;
 border-radius:18px;padding:25px 10px;
 transition:.2s
}
a:hover{background:#383000;transform:scale(1.03)}
.icon{font-size:65px}
.name{font-size:20px;font-weight:bold;margin-top:15px}
small{display:block;color:#ffd700;margin-top:10px}
footer{color:#999;margin-top:45px;font-size:13px}
@media(max-width:420px){
 .games{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
 <h1>🎮 MAHAN GAME</h1>
 <h2>به دنیای بازی خوش آمدید!</h2>

 <div class="games">
  <a href="ladder.html">
   <div class="icon">🎲🐍</div>
   <div class="name">مار و پله</div>
   <small>ورود به بازی</small>
  </a>

  <a href="snake.html">
   <div class="icon">🐍🍎</div>
   <div class="name">مار و سیب</div>
   <small>ورود به بازی</small>
  </a>
 </div>

 <footer>MAHAN GAME | PLAY & ENJOY</footer>
</div>
</body>
</html>
