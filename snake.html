
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازی مار و سیب</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Tahoma,Arial;text-align:center;padding:18px
}
h1{color:#65e58a}
.panel{
 max-width:450px;margin:auto;background:#1d2a40;
 padding:16px;border-radius:20px
}
#board{
 width:min(88vw,380px);height:min(88vw,380px);
 background:#182f29;border:4px solid #65e58a;
 border-radius:12px;display:block;margin:15px auto
}
button{
 border:0;border-radius:12px;padding:13px 20px;
 margin:5px;background:#65e58a;color:#102018;
 font-weight:bold;font-size:17px;cursor:pointer
}
.score{font-size:22px;color:#ffd34e}
.controls{
 display:grid;grid-template-columns:repeat(3,65px);
 justify-content:center;gap:7px;margin-top:15px
}
.controls button{padding:13px;margin:0}
.empty{visibility:hidden}
</style>
</head>
<body>
<div class="panel">
<h1>🐍 مار و سیب 🍎</h1>
<p>سیب‌ها رو بخور و رکوردت رو بشکن!</p>
<div class="score">امتیاز: <span id="score">0</span></div>
<canvas id="board" width="360" height="360"></canvas>
<button onclick="start()">شروع بازی</button>
<button onclick="pause()">توقف</button>
<div id="msg">برای شروع دکمه شروع را بزن.</div>

<div class="controls">
<button class="empty"> </button>
<button onclick="change(0,-1)">⬆️</button>
<button class="empty"> </button>
<button onclick="change(-1,0)">⬅️</button>
<button onclick="change(0,1)">⬇️</button>
<button onclick="change(1,0)">➡️</button>
</div>
<p>با دکمه‌ها یا فلش‌های کیبورد بازی کن.</p>
</div>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const size=20, count=18;
let snake,food,dx,dy,score,timer,running=false;
let directionLocked=false;

function newFood(){
 do{
 food={x:Math.floor(Math.random()*count),
 y:Math.floor(Math.random()*count)};
 }while(snake.some(p=>p.x===food.x&&p.y===food.y));
}

function draw(){
 ctx.fillStyle="#182f29";
 ctx.fillRect(0,0,360,360);

 ctx.fillStyle="#ff4b5c";
 ctx.beginPath();
 ctx.arc(food.x*20+10,food.y*20+10,8,0,Math.PI*2);
 ctx.fill();

 snake.forEach((p,i)=>{
 ctx.fillStyle=i===0?"#b6ff72":"#54d878";
 ctx.fillRect(p.x*20+1,p.y*20+1,18,18);
 });

 if(snake.length){
 ctx.fillStyle="#102018";
 ctx.fillRect(snake[0].x*20+5,snake[0].y*20+6,3,3);
 ctx.fillRect(snake[0].x*20+12,snake[0].y*20+6,3,3);
 }
}

function start(){
 clearInterval(timer);
 snake=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];
 dx=1;dy=0;score=0;
 running=true;
 directionLocked=false;
 document.getElementById("score").textContent=score;
 document.getElementById("msg").textContent="بازی شروع شد! 🍎";
 newFood();draw();
 timer=setInterval(move,145);
}

function pause(){
 if(!running)return;
 running=false;clearInterval(timer);
 document.getElementById("msg").textContent="بازی متوقف شد.";
}

function change(x,y){
 if(!running||directionLocked)return;
 if(x===-dx&&y===-dy)return;
 dx=x;dy=y;
 directionLocked=true;
}

function move(){
 const head={x:snake[0].x+dx,y:snake[0].y+dy};
 const eating=head.x===food.x&&head.y===food.y;
 const body=eating?snake:snake.slice(0,-1);

 if(head.x<0||head.x>=count||head.y<0||head.y>=count||
 body.some(p=>p.x===head.x&&p.y===head.y)){
 running=false;clearInterval(timer);
 document.getElementById("msg").textContent=
 "بازی تمام شد! امتیازت: "+score+" | دوباره شروع کن.";
 return;
 }

 snake.unshift(head);
 if(eating){
 score+=10;
 document.getElementById("score").textContent=score;
 newFood();
 }else snake.pop();

 directionLocked=false;
 draw();
}

document.addEventListener("keydown",e=>{
 const keys={
 ArrowUp:[0,-1],ArrowDown:[0,1],
 ArrowLeft:[-1,0],ArrowRight:[1,0],
 w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]
 };
 if(keys[e.key]){
 e.preventDefault();
 change(...keys[e.key]);
 }
});

draw();
</script>
</body>
</html>
